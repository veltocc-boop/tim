<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .top-message {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            background: #111;
            border-bottom: 1px solid #222;
            font-size: 20px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        header {
            margin-top: 40px;
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .search-box {
            margin-top: 30px;
            width: 90%;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 8px;
            border: none;
            font-size: 18px;
            outline: none;
        }

        .buttons {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 26px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #333;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            opacity: 0.5;
            font-size: 14px;
        }
    </style>

    <script>
        function search() {
            const q = document.getElementById("search").value.trim();
            if (q.length === 0) return;
            window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
        }

        document.addEventListener("keydown", function(e) {
            if (e.key === "Enter") search();
        });
    </script>
</head>

<body>

    <div class="top-message">
        TAKK FOR AT DERE BRUKER DETTE! — NIK
    </div>

    <header>Time</header>

    <div class="search-box">
        <input id="search" type="text" placeholder="Search the web...">
    </div>

    <div class="buttons">
        <div class="btn" onclick="window.location.href='https://youtube.com'">YouTube</div>
        <div class="btn" onclick="window.location.href='https://google.com'">Google</div>
        <div class="btn" onclick="window.location.href='https://tiktok.com'">TikTok</div>
        <div class="btn" onclick="window.location.href='https://github.com'">GitHub</div>
    </div>

    <footer>Made by Nikolas</footer>

</body>
</html>
